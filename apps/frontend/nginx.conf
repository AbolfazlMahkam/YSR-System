server {
    listen       80;
    listen       [::]:80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # ---- gzip ----
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      application/xml image/svg+xml font/woff font/woff2;

    # ---- lightweight healthcheck endpoint (used by compose) ----
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---- Uploaded files are referenced as ROOT-RELATIVE /uploads/... in the UI,
    #      so the browser resolves them against the FRONTEND origin. Proxy them to
    #      the backend, otherwise every uploaded-file link 404s or 502s.
    #
    #      Docker Compose: `depends_on: condition: service_healthy` guarantees the
    #      backend container is running before the frontend starts, so a direct
    #      proxy_pass is safe. Change `backend` to the actual backend host when
    #      deploying without Docker (e.g. `http://api.example.com`).
    location /uploads/ {
        proxy_pass              http://backend:3000;
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
    }

    # ---- long-cache hashed Vite assets ----
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # ---- index.html must never be cached, or clients pin a stale bundle hash ----
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ---- SPA fallback: every unknown path -> index.html (react-router v7) ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
