map $time_local $maintenance_hour {
    ~^[^:]+:(0[1-5]):  1;
    default             0;
}

server {
    listen       80;
    listen       [::]:80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # ---- gzip ----
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      application/xml image/svg+xml font/woff font/woff2;

    # ---- maintenance mode (1am-6am daily) ----
    if ($maintenance_hour) {
        return 503;
    }
    error_page 503 /maintenance.html;
    location = /maintenance.html {
        internal;
    }

    # ---- lightweight healthcheck endpoint (used by compose) ----
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---- Uploaded files are referenced as ROOT-RELATIVE /uploads/... in the UI,
    #      so the browser resolves them against the FRONTEND origin. Proxy them to
    #      the backend, otherwise every uploaded-file link 404s.
    #
    #      The upstream is held in a VARIABLE ($upstream) and resolved at REQUEST
    #      time via Docker's embedded DNS (127.0.0.11). This lets nginx START even
    #      when `backend` is not yet reachable (no boot-time "host not found"),
    #      which matters for separate/PaaS deploys and ordering races.
    #      On a split PaaS deploy where the backend lives on another host, change
    #      `set $upstream` below to that host (or template it via envsubst).
    location /uploads/ {
        resolver                127.0.0.11 valid=30s ipv6=off;
        set $upstream           http://backend:3000;
        proxy_pass              $upstream;
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
    }

    # ---- long-cache hashed Vite assets ----
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # ---- index.html must never be cached, or clients pin a stale bundle hash ----
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ---- SPA fallback: every unknown path -> index.html (react-router v7) ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
